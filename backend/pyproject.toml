[project]
name = "docagent"
version = "0.1.0"
description = "RAG agent over PDF documents: FastAPI, pgvector, hybrid search, LangGraph"
authors = [
    { name = "Szymon Jakubicz", email = "sjakubicz@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "bm25s>=0.3.16",
    "fastapi[standard]==0.162.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "openai>=3.42.1",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pytesseract>=0.3.13",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

[tool.alembic]
script_location = "docagent:migrations"

[tool.coverage.run]
source = ["docagent"]
omit = ["*/migrations/*", "*/__main__.py", "*/export_openapi.py"]

[tool.mypy]
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bm25s.*", "pdfplumber.*", "pytesseract.*", "pgvector.*"]
ignore_missing_imports = true
