name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docagent
          POSTGRES_PASSWORD: docagent
          POSTGRES_DB: docagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docagent"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://docagent:docagent@localhost:5432/docagent_test
      TEST_DATABASE_URL: postgresql+psycopg://docagent:docagent@localhost:5432/docagent_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Models match migrations
        run: uv run alembic check
      - name: Generated API client is up to date
        run: |
          uv run python -m docagent.export_openapi ../frontend/openapi.json
          git diff --exit-code ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn openapi-ts && git diff --exit-code src/client
      - run: yarn format:check
      - run: yarn lint
      - run: yarn build

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: docagent-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
